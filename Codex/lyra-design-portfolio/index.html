    <style>
:root {
  color-scheme: light;
  --bg: #f4f4f4;
  --ink: #111;
  --muted: #6d6d6d;
  --line: #dedede;
  --panel: #fff;
  --accent: #c54d2f;
  --green: #1d6b5a;
  --rose: #b13f58;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, "Noto Sans TC", "PingFang TC", sans-serif;
  letter-spacing: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 28px;
  min-height: 64px;
  padding: 0 28px;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
}

.brand {
  color: #111;
  font-size: 17px;
  font-weight: 900;
}

.nav {
  display: flex;
  gap: 20px;
  color: #3b3b3b;
  font-size: 14px;
  font-weight: 700;
}

.nav a:hover {
  color: var(--accent);
}

.pill {
  margin-left: auto;
  padding: 11px 18px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-size: 14px;
  font-weight: 800;
}

.hero {
  display: flex;
  align-items: center;
  min-height: 230px;
  padding: 42px 28px 34px;
  background:
    linear-gradient(90deg, rgba(197, 77, 47, 0.08), transparent 48%),
    #fff;
  border-bottom: 1px solid var(--line);
}

.hero-inner {
  width: min(1120px, 100%);
  margin: 0 auto;
}

.kicker,
.label {
  margin: 0 0 10px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
}

h1 {
  max-width: 900px;
  margin: 0;
  font-size: clamp(34px, 4vw, 58px);
  line-height: 1.04;
  font-weight: 900;
}

h1 span {
  color: #2d2d2d;
}

.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.meta-row span {
  padding: 9px 12px;
  border: 1px solid #d6d6d6;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  color: #4b4b4b;
  font-size: 13px;
  font-weight: 700;
}

.project-shell {
  display: grid;
  grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
  gap: 32px;
  width: min(1380px, 100%);
  margin: 0 auto;
  padding: 28px 28px 80px;
}

.project-info {
  min-width: 0;
}

.sticky {
  position: sticky;
  top: 92px;
}

.sticky h2 {
  margin: 0 0 8px;
  font-size: 25px;
  line-height: 1.1;
}

.sticky p:not(.label) {
  margin: 0 0 22px;
  color: var(--muted);
  line-height: 1.55;
}


.new-gallery {
  grid-column: 2;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 36px;
  align-items: start;
  width: 100%;
  margin-top: 0;
}

.new-gallery figure {
  position: relative;
  margin: 0;
  background: #fff;
}

.new-gallery .cover {
  grid-column: 1 / -1;
}

.new-gallery img {
  display: block;
  width: 100%;
  height: auto;
  background: #e8e8e8;
}

.gallery figure::after,
.new-gallery figure::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
}

.gallery img,
.new-gallery img {
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  -webkit-touch-callout: none;
}

@media (max-width: 860px) {
  .new-gallery {
    gap: 12px;
  }
}

.gallery {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.gallery figure {
  position: relative;
  width: min(100%, 1400px);
  margin: 0;
  background: #fff;
}

.gallery img {
  display: block;
  width: 100%;
  height: auto;
  background: #e8e8e8;
}

.loading {
  width: 100%;
  padding: 56px 24px;
  background: #fff;
  border: 1px solid var(--line);
  color: var(--muted);
  text-align: center;
  font-weight: 700;
}

@media (max-width: 860px) {
  .topbar {
    padding: 0 16px;
    gap: 14px;
  }

  .nav {
    display: none;
  }

  .hero {
    min-height: 210px;
    padding: 34px 18px 28px;
  }

  h1 {
    font-size: 34px;
  }

  .project-shell {
    display: block;
    padding: 22px 14px 56px;
  }

  .sticky {
    position: static;
    margin-bottom: 22px;
  }

  .gallery {
    gap: 8px;
  }
}

</style>

    <script>
document.addEventListener("contextmenu", (event) => {
  event.preventDefault();
});

document.addEventListener("dragstart", (event) => {
  if (event.target.closest("img, figure")) {
    event.preventDefault();
  }
});

document.addEventListener("copy", (event) => {
  if (document.getSelection()?.toString()) {
    event.preventDefault();
  }
});

document.addEventListener("keydown", (event) => {
  const key = event.key.toLowerCase();
  const command = event.metaKey || event.ctrlKey;
  const blockedCommand = command && ["s", "u", "c", "p"].includes(key);
  const blockedDevTools =
    event.key === "F12" ||
    (command && event.shiftKey && ["i", "j", "c"].includes(key)) ||
    (event.metaKey && event.altKey && ["i", "j", "c"].includes(key));

  if (blockedCommand || blockedDevTools) {
    event.preventDefault();
    event.stopPropagation();
  }
});
