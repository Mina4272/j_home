<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lyra Design | Graphic Design Portfolio</title>
    <script>
(async () => {
  const response = await fetch("../lyra-design-portfolio-no-filter/index.html", { cache: "no-store" });
  if (!response.ok) {
    throw new Error("Unable to load portfolio page");
  }
  const html = await response.text();
  document.open();
  document.write(html);
  document.close();
})().catch(() => {
  window.location.replace("../lyra-design-portfolio-no-filter/");
});
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=../lyra-design-portfolio-no-filter/">
    </noscript>
  </head>
  <body></body>
</html>
